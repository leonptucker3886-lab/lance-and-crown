# Test every push to main, then deploy it to Vercel.
#
# Why this exists: the Vercel project `lance-and-crown` has no Git link, so
# Vercel never receives a push event and never builds on its own (the repo's
# Deployments API stayed empty through every push). This closes that gap with
# the CLI, which needs no Git integration.
#
# One-time setup — add a repository secret named VERCEL_TOKEN:
#   Vercel dashboard -> Account Settings -> Tokens -> Create Token
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#
# The org and project ids below are public identifiers, not credentials.
# Deliberately no `if:` expressions: the token is checked in the shell, so an
# unset secret means "tested, not deployed" rather than a failed workflow.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_H9UMORlo1bM8ah2vzLl75Ujs
      VERCEL_PROJECT_ID: prj_s8QCEhICBZgLrc5N6nzC5vU5dZ8l
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test, then deploy when a token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # No lockfile is committed, so `npm ci` would fail here.
          npm install --no-audit --no-fund
          node tests/balance.mjs
          node tests/pwa.mjs
          node tests/smoke.mjs

          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN is not set, so this push was tested but not deployed."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          npx --yes vercel@latest deploy --prod --yes --token "${VERCEL_TOKEN}"
